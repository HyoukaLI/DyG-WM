# Node-classification configuration for DyG-WM and the baselines
# (SpikeNet / SG-JEPA protocol on DBLP, Tmall and Patent).
#
# Every run reads the shared probe/training protocol, the section of the
# selected model, and finally the dataset entry under `datasets`, whose keys
# are deep-merged on top.

data_dir: processed_data
seeds: [42, 44, 46, 48, 50]

# Non-overlapping windows of `window_size` cumulative snapshots.
window_size: 3

# Frozen MLP probe on the final snapshot: stratified split of the labelled
# nodes; `train_ratio` is the labelled fraction (0.4 / 0.6 / 0.8 in the paper,
# overridable with --train_ratio).
probe:
  train_ratio: 0.4
  validation_ratio_within_train: 0.1

# Self-supervised training and checkpoint selection of DyG-WM and SG-JEPA.
# The checkpoint is selected by the validation macro-F1 of the probe on the
# same readout views that are reported (for DyG-WM a logit ensemble of the
# listed views; both lists must be equal).
training:
  epochs: 120
  node_batch_size: 1024
  learning_rate: 0.001
  weight_decay: 1.0e-05
  grad_clip: 1.0
  eval_every: 5
  dense_eval_epochs: 10
  selection_probe_epochs: 100
  probe_epochs: 500
  probe_hidden_dim: 512
  min_checkpoint_epoch: 25
  dyg_wm_readout_views: [prediction, encoder, hop2]
  dyg_wm_checkpoint_views: [prediction, encoder, hop2]

# ----------------------------------------------------------------------------
# DyG-WM (node variant: node-level JEPA objective, no link head)
# ----------------------------------------------------------------------------
dyg_wm:
  hidden_dim: 128
  rwpe_dim: 8
  rwpe_walks: 16
  time_dim: 32
  gnn_layers: 2
  predictor_hidden_dim: 256
  rwpe_seed: 42
  cache_rwpe: true
  event_dim: 8
  signature_depth: 2
  subgraph_budget: 32
  ema_momentum: 0.995
  node_loss_weight: 1.0
  node_contrastive_loss_weight: 1.0
  contrastive_temperature: 0.2
  link_loss_weight: 0.0
  relation_loss_weight: 0.0
  variance_loss_weight: 0.02
  covariance_loss_weight: 0.001
  variance_target: 0.5

# ----------------------------------------------------------------------------
# Baselines
# ----------------------------------------------------------------------------
sg_jepa:
  hidden_dim: 128
  rwpe_dim: 8
  rwpe_walks: 16
  time_dim: 32
  gnn_layers: 2
  predictor_hidden_dim: 256
  rwpe_seed: 42
  cache_rwpe: true
  threshold: 0.05
  reset_potential: 0.0
  temperature: 0.2

# EvolveGCN-H (supervised; the epoch is chosen on validation, then refit on train+validation)
evolvegcn_h:
  hidden_dim: 128
  layers: 2
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

# ROLAND (supervised, same refit rule as EvolveGCN-H)
roland:
  hidden_dim: 128
  layers: 2
  dropout: 0.0
  bptt_steps: 4
  epochs: 100
  learning_rate: 0.03
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

# TGN: link-prediction pretraining on the snapshot edges, then a frozen node probe
tgn:
  time_dim: 100
  layers: 1
  heads: 2
  num_neighbors: 10
  dropout: 0.1
  batch_size: 200
  inference_batch_size: 512
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

# TGAT: same two-stage protocol as TGN
tgat:
  hidden_dim: 100
  layers: 2
  heads: 2
  num_neighbors: 20
  dropout: 0.1
  uniform_neighbors: false
  batch_size: 200
  inference_batch_size: 256
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

# CAWN / TCL / GraphMixer / DyGFormer: DyGLib backbones, same two-stage protocol
cawn:
  time_dim: 100
  position_feat_dim: 128
  walk_length: 1
  num_walk_heads: 8
  num_neighbors: 32
  dropout: 0.1
  sample_neighbor_strategy: time_interval_aware
  time_scaling_factor: 1.0e-06
  batch_size: 200
  inference_batch_size: 128
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

tcl:
  time_dim: 100
  layers: 2
  heads: 2
  num_neighbors: 20
  dropout: 0.1
  batch_size: 200
  inference_batch_size: 256
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

graphmixer:
  time_dim: 100
  layers: 2
  heads: 2
  num_neighbors: 30
  time_gap: 2000
  dropout: 0.5
  batch_size: 200
  inference_batch_size: 256
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

dygformer:
  time_dim: 100
  channel_embedding_dim: 50
  patch_size: 1
  layers: 2
  heads: 2
  dropout: 0.1
  max_input_sequence_length: 32
  batch_size: 200
  inference_batch_size: 128
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

# CLDG / MaskDGNN / DVGMAE: snapshot self-supervision, then a frozen node probe
cldg:
  hidden_dim: 128
  embedding_dim: 128
  layers: 2
  dropout: 0.0
  num_spans: 4
  num_views: 4
  view_strategy: sequential
  temperature: 0.07
  contrastive_batch_size: 1024
  probe_hidden_dim: 128
  epochs: 100
  learning_rate: 0.004
  weight_decay: 0.0005
  grad_clip: 1.0
  eval_every: 5

maskdgnn:
  hidden_dim: 64
  layers: 2
  dropout: 0.1
  window_size: 4
  mask_ratio: 0.3
  dynamics_ratio: 0.7
  dynamics_weight: 1.0
  existing_offset: 2.0
  new_node_offset: -0.5
  pagerank_damping: 0.85
  pagerank_steps: 10
  pretrain_pair_limit: 4096
  probe_hidden_dim: 128
  epochs: 100
  learning_rate: 0.008
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 5

dvgmae:
  hidden_dim: 64
  layers: 2
  dropout: 0.1
  window_size: 4
  mask_ratio: 0.3
  history_balance: 0.5
  kl_weight: 0.001
  feature_weight: 0.1
  pretrain_pair_limit: 4096
  probe_hidden_dim: 128
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1.0e-05
  grad_clip: 1.0
  eval_every: 5

# ----------------------------------------------------------------------------
# Dataset-specific settings
# ----------------------------------------------------------------------------
datasets:
  dblp:
    training:
      node_batch_size: 1024
  tmall:
    training:
      node_batch_size: 1024
  patent:
    training:
      node_batch_size: 2048
